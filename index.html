<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jogo 3D - Mundo Aberto</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:Arial;color:white}
canvas{display:block}
#hud{position:absolute;top:15px;left:15px;right:15px;pointer-events:none}
#title{font-size:19px;font-weight:bold;text-shadow:2px 2px 4px black}
#speed{margin-top:8px;font-size:17px;text-shadow:2px 2px 4px black}
#controls{position:absolute;bottom:25px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px}
.group{display:flex;gap:12px;align-items:end}
button{width:66px;height:66px;border:2px solid #ffffff80;border-radius:18px;background:#111c;color:white;font-size:25px;font-weight:bold;touch-action:none}
button:active{background:#ffffff55}
#message{position:absolute;bottom:105px;left:0;right:0;text-align:center;color:#ddd;font-size:12px}
</style>
</head>
<body>
<div id="hud">
 <div id="title">JOGO 3D • MUNDO ABERTO</div>
 <div id="speed">0 KM/H</div>
</div>

<div id="message">Explore a cidade e dirija livremente!</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="brake">■</button>
  <button id="gas">▲</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9dc);
scene.fog = new THREE.Fog(0x87b9dc,100,350);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,500);
const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526070,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(80,120,50);
scene.add(sun);

function material(color){
 return new THREE.MeshStandardMaterial({color,roughness:0.8});
}

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 material(0x487b43)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.1;
scene.add(ground);

// Ruas
function road(x,z,w,d){
 const r=new THREE.Mesh(new THREE.BoxGeometry(w,0.12,d),material(0x30343a));
 r.position.set(x,0,z);
 scene.add(r);
}
road(0,0,16,500);
road(0,0,500,16);

// Faixas das ruas
for(let i=-240;i<250;i+=12){
 let line=new THREE.Mesh(new THREE.BoxGeometry(.25,.04,5),material(0xf5e8a5));
 line.position.set(0,.08,i);
 scene.add(line);
 let line2=new THREE.Mesh(new THREE.BoxGeometry(5,.04,.25),material(0xf5e8a5));
 line2.position.set(i,.08,0);
 scene.add(line2);
}

// Prédios
for(let x=-220;x<=220;x+=30){
 for(let z=-220;z<=220;z+=30){
  if(Math.abs(x)<18 || Math.abs(z)<18)continue;
  let h=12+Math.random()*35;
  let w=12+Math.random()*8;
  let building=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,w),
   material([0x9cabb7,0xc1b7a8,0x777f89,0xb3a28c][Math.floor(Math.random()*4)])
  );
  building.position.set(x,h/2,z);
  scene.add(building);
  let roof=new THREE.Mesh(
   new THREE.BoxGeometry(w+0.5,0.5,w+0.5),
   material(0x41464d)
  );
  roof.position.set(x,h,z);
  scene.add(roof);
 }
}

// Carro
const car=new THREE.Group();
scene.add(car);

const body=new THREE.Mesh(
 new THREE.BoxGeometry(2.5,0.75,4.6),
 material(0xc90019)
);
body.position.y=1;
car.add(body);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(1.9,0.85,2.1),
 material(0x202e3b)
);
cabin.position.set(0,1.75,-0.25);
car.add(cabin);

const hood=new THREE.Mesh(
 new THREE.BoxGeometry(2.35,.18,1.1),
 material(0xe51b30)
);
hood.position.set(0,1.42,1.45);
car.add(hood);

// Faróis
for(let x of [-.85,.85]){
 let light=new THREE.Mesh(
  new THREE.BoxGeometry(.4,.18,.08),
  material(0xffffff)
 );
 light.position.set(x,1.1,2.32);
 car.add(light);
}

// Rodas
const wheels=[];
for(let x of [-1.3,1.3]){
 for(let z of [-1.45,1.45]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.48,.48,.3,16),
   material(0x151515)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.55,z);
  car.add(wheel);
  wheels.push(wheel);
 }
}

car.position.set(0,0,0);

let speed=0;
let steering=0;
let acceleration=0;
let braking=0;

function hold(id,callback){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  callback(true);
 });
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  el.addEventListener(ev,()=>callback(false));
 });
}

hold('gas',v=>acceleration=v);
hold('brake',v=>braking=v);
hold('left',v=>steering=v?-1:0);
hold('right',v=>steering=v?1:0);

function animate(){
 requestAnimationFrame(animate);

 if(acceleration)speed=Math.min(speed+0.012,1.6);
 else speed*=0.992;

 if(braking)speed*=0.94;

 if(Math.abs(speed)>.015){
  car.rotation.y-=steering*0.025*Math.sign(speed);
 }

 car.position.x+=Math.sin(car.rotation.y)*speed;
 car.position.z+=Math.cos(car.rotation.y)*speed;

 wheels.forEach(w=>w.rotation.x+=speed*0.15);

 const target=new THREE.Vector3(
  car.position.x-Math.sin(car.rotation.y)*10,
  car.position.y+6,
  car.position.z-Math.cos(car.rotation.y)*10
 );

 camera.position.lerp(target,0.09);
 camera.lookAt(car.position.x,1.2,car.position.z);

 document.getElementById('speed').textContent=
 Math.round(Math.abs(speed)*100)+' KM/H';

 renderer.render(scene,camera);
}

camera.position.set(0,7,-12);
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
